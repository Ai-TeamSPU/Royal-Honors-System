document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ct:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #E5C66A;outline-offset:2px}\n  ::placeholder{color:#94a3b8}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"display:flex;min-height:100vh;background:#F4F7FB\">\n\n  <aside style=\"width:286px;flex:none;background:#0B315C;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh\">\n    <div style=\"height:92px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);padding:12px;display:flex;align-items:center;gap:12px\">\n      <div style=\"width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:#E5C66A;color:#0B315C;font-size:18px;font-weight:700\">ร<\u002Fdiv>\n      <div style=\"min-width:0\">\n        <p style=\"margin:0;font-size:10px;font-weight:700;letter-spacing:.16em;color:#E5C66A\">UNIVERSITY<\u002Fp>\n        <p style=\"margin:2px 0 0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">เครื่องราชอิสริยาภรณ์<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;overflow-y:auto;padding:16px 8px\">\n      <sc-for list=\"{{ navGroups }}\" as=\"group\" hint-placeholder-count=\"3\">\n        <div style=\"margin-bottom:18px\">\n          <p style=\"margin:0 0 8px;padding:0 12px;font-size:10px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.45)\">{{ group.label }}<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ item.go }}\" style=\"width:100%;height:42px;border:0;border-radius:12px;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:14px;text-align:left;cursor:pointer;background:transparent;color:rgba(255,255,255,.8);{{ item.tone }}\">\n                <span class=\"ic\" style=\"-webkit-mask-image:url({{ item.iconUrl }});mask-image:url({{ item.iconUrl }})\"><\u002Fspan>\n                <span>{{ item.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"flex:none;border-top:1px solid rgba(255,255,255,.1);padding:12px;display:flex;align-items:center;gap:12px\">\n      <div style=\"width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:999px;border:1px solid rgba(229,198,106,.6);background:#173F70;color:#E5C66A;font-size:12px;font-weight:700\">K<\u002Fdiv>\n      <div style=\"min-width:0\">\n        <p style=\"margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Kittipitch Thaweepatphitak<\u002Fp>\n        <p style=\"margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.55)\">ผู้ดูแลระบบ<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n    <header style=\"position:sticky;top:0;z-index:30;height:70px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #DDE6F0;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);padding:0 32px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span class=\"ic\" style=\"width:16px;height:16px;color:#B88A24;-webkit-mask-image:url(&quot;0c198e92-c18c-46c8-9085-80113062dfae&quot;);mask-image:url(&quot;0c198e92-c18c-46c8-9085-80113062dfae&quot;)\"><\u002Fspan>\n        <div>\n          <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;color:#B88A24\">ROYAL HONORS ADMINISTRATION<\u002Fp>\n          <p style=\"margin:1px 0 0;font-size:14px;font-weight:600;color:#102F55\">{{ headerTitle }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #DDE6F0;background:#F8FAFD;border-radius:999px;padding:6px 12px;font-size:12px;color:#64748b\">\n        <span class=\"ic\" style=\"width:14px;height:14px;color:#B88A24;-webkit-mask-image:url(&quot;45ef3240-c7a9-419c-b0b4-033edc8e6d93&quot;);mask-image:url(&quot;45ef3240-c7a9-419c-b0b4-033edc8e6d93&quot;)\"><\u002Fspan>\n        ข้อมูลและการพิจารณาอย่างเป็นระบบ\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <main style=\"flex:1;min-height:0;padding:32px\">\n\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"margin-bottom:28px\">\n            <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">ภาพรวมการปฏิบัติงาน<\u002Fp>\n            <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">ศูนย์กลางการพิจารณาเครื่องราชอิสริยาภรณ์<\u002Fh1>\n            <p style=\"margin:8px 0 0;max-width:672px;font-size:14px;line-height:24px;color:#64748b\">ติดตามสถานะการตรวจคุณสมบัติ การพิจารณารายชื่อ และผลดำเนินงานในแต่ละรอบจากข้อมูลที่บันทึกในระบบ<\u002Fp>\n          <\u002Fdiv>\n          <section style=\"display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))\">\n            <sc-for list=\"{{ tiles }}\" as=\"tile\" hint-placeholder-count=\"4\">\n              <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(16,47,85,.04);padding:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n                <div>\n                  <p style=\"margin:0;font-size:14px;color:#64748b\">{{ tile.label }}<\u002Fp>\n                  <p style=\"margin:4px 0 0;font-size:30px;font-weight:700;color:#102F55;font-variant-numeric:tabular-nums\">{{ tile.value }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:16px;{{ tile.tone }}\">\n                  <span class=\"ic\" style=\"width:20px;height:20px;-webkit-mask-image:url({{ tile.iconUrl }});mask-image:url({{ tile.iconUrl }})\"><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section style=\"margin-top:28px;display:grid;gap:24px;grid-template-columns:1.55fr 0.8fr;align-items:start\">\n            <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px;overflow:hidden\">\n              <div style=\"border-bottom:1px solid #E7EDF5;padding:20px 24px;display:flex;flex-direction:column;gap:16px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n                  <div>\n                    <h2 style=\"margin:0;font-size:16px;font-weight:700;color:#102F55\">รอบตรวจและพิจารณาล่าสุด<\u002Fh2>\n                    <p style=\"margin:4px 0 0;font-size:14px;color:#64748b\">กรองตามปีและสถานะเพื่อดูรายการที่ต้องดำเนินการ<\u002Fp>\n                  <\u002Fdiv>\n                  <span class=\"ic\" style=\"width:24px;height:24px;color:#B88A24;-webkit-mask-image:url(&quot;c4463460-26da-4cbe-ab8c-6507006eb9c5&quot;);mask-image:url(&quot;c4463460-26da-4cbe-ab8c-6507006eb9c5&quot;)\"><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;gap:8px;grid-template-columns:1fr 1fr\">\n                  <sc-raw-select style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;color:#102F55\">\n                    <option>ทุกปีรอบตรวจ<\u002Foption>\n                  <\u002Fsc-raw-select>\n                  <sc-raw-select style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;color:#102F55\">\n                    <option>ทุกสถานะการพิจารณา<\u002Foption>\n                    <option>ฉบับร่าง<\u002Foption>\n                    <option>กำหนดรอบแล้ว<\u002Foption>\n                    <option>กำลังประมวลผล<\u002Foption>\n                    <option>รอพิจารณา<\u002Foption>\n                    <option>เสร็จสิ้น<\u002Foption>\n                    <option>ระงับ<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasRounds }}\" hint-placeholder-val=\"{{ false }}\">\n                <div>\n                  <sc-for list=\"{{ rounds }}\" as=\"r\" hint-placeholder-count=\"0\">\n                    <div style=\"border-top:1px solid #EDF1F6;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n                      <div>\n                        <p style=\"margin:0;font-weight:600;color:#102F55\">{{ r.title }}<\u002Fp>\n                        <p style=\"margin:4px 0 0;font-size:12px;color:#64748b\">ปี {{ r.year }} · ยังไม่กำหนดเกณฑ์<\u002Fp>\n                      <\u002Fdiv>\n                      <span style=\"border-radius:999px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:600;padding:4px 10px\">ฉบับร่าง<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noRounds }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:24px\">\n                  <div style=\"border:1px dashed #C9D6E6;border-radius:16px;background:rgba(255,255,255,.6);padding:40px 24px;text-align:center\">\n                    <p style=\"margin:0;font-weight:600;color:#102F55\">ยังไม่มีรอบตรวจ<\u002Fp>\n                    <p style=\"margin:8px auto 16px;max-width:448px;font-size:14px;line-height:24px;color:#64748b\">เมื่อกำหนดเกณฑ์และสร้างรอบตรวจ รายการจะปรากฏในส่วนนี้<\u002Fp>\n                    <button type=\"button\" sc-camel-on-click=\"{{ goCreateRound }}\" style=\"height:40px;border:0;border-radius:8px;background:#0B3A6E;color:#fff;font-size:14px;padding:0 18px;cursor:pointer\">สร้างรอบตรวจ<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid #DCE6F2;border-radius:12px;background:linear-gradient(180deg,#0B3A6E,#082C53);color:#fff;box-shadow:0 16px 35px rgba(8,45,85,.18);padding:24px\">\n              <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#E5C66A\">เริ่มต้นใช้งาน<\u002Fp>\n              <h2 style=\"margin:10px 0 0;font-size:20px;font-weight:700;line-height:1.4\">สามขั้นก่อนประมวลผลรอบแรก<\u002Fh2>\n              <p style=\"margin:8px 0 0;font-size:13px;line-height:22px;color:rgba(255,255,255,.7)\">ทำครบสามขั้นแล้วระบบจะคัดกรองผู้มีสิทธิให้อัตโนมัติ<\u002Fp>\n              <div style=\"margin-top:20px;border-top:1px solid rgba(255,255,255,.15);padding-top:20px;display:flex;flex-direction:column;gap:14px\">\n                <sc-for list=\"{{ setupSteps }}\" as=\"step\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:flex-start;gap:12px\">\n                    <div style=\"width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:999px;font-size:12px;font-weight:700;{{ step.badgeTone }}\">{{ step.badge }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <p style=\"margin:0;font-size:14px;font-weight:600;color:#fff\">{{ step.title }}<\u002Fp>\n                      <p style=\"margin:2px 0 0;font-size:12px;line-height:20px;color:rgba(255,255,255,.6)\">{{ step.detail }}<\u002Fp>\n                    <\u002Fdiv>\n                    <button type=\"button\" sc-camel-on-click=\"{{ step.go }}\" style=\"flex:none;height:30px;border:1px solid rgba(229,198,106,.55);border-radius:8px;background:transparent;color:#E5C66A;font-size:12px;padding:0 12px;cursor:pointer\">{{ step.action }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPersonnel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"margin-bottom:28px;display:flex;gap:16px;align-items:flex-end;justify-content:space-between\">\n            <div>\n              <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">ทะเบียนบุคลากร<\u002Fp>\n              <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">ข้อมูลบุคลากรและประวัติการปฏิบัติงาน<\u002Fh1>\n              <p style=\"margin:8px 0 0;max-width:672px;font-size:14px;line-height:24px;color:#64748b\">จัดเก็บและค้นหาข้อมูลบุคลากร หน่วยงาน ตำแหน่ง และวันเริ่มปฏิบัติงาน เพื่อใช้เป็นฐานข้อมูลสำหรับการตรวจคุณสมบัติ<\u002Fp>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ togglePersonForm }}\" style=\"flex:none;height:40px;border:0;border-radius:8px;background:#0B3A6E;color:#fff;font-size:14px;font-weight:500;padding:0 16px;display:flex;align-items:center;gap:8px;cursor:pointer\">\n              <span class=\"ic\" style=\"width:16px;height:16px;-webkit-mask-image:url(&quot;488e4b03-871d-4123-a5fe-5caf55f3a08c&quot;);mask-image:url(&quot;488e4b03-871d-4123-a5fe-5caf55f3a08c&quot;)\"><\u002Fspan>\n              เพิ่มบุคลากร\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showPersonForm }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-bottom:24px;border:1px solid rgba(212,178,87,.5);background:#FFFDF8;border-radius:12px;padding:24px\">\n              <h2 style=\"margin:0;font-size:16px;font-weight:700;color:#102F55\">บันทึกข้อมูลบุคลากร<\u002Fh2>\n              <p style=\"margin:4px 0 0;font-size:13px;color:#64748b\">ช่องที่มีจุดสีทองเป็นข้อมูลที่จำเป็นต่อการคัดกรอง<\u002Fp>\n\n              <p style=\"margin:24px 0 0;font-size:12px;font-weight:700;letter-spacing:.12em;color:#B88A24\">ตัวตน<\u002Fp>\n              <div style=\"margin-top:12px;display:grid;gap:16px;grid-template-columns:1fr 1fr\">\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">รหัสบุคลากร <span style=\"color:#B88A24\">•<\u002Fspan><\u002Flabel>\n                  <input value=\"{{ formCode }}\" sc-camel-on-input=\"{{ setFormCode }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">อีเมล<\u002Flabel>\n                  <input style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">ชื่อ <span style=\"color:#B88A24\">•<\u002Fspan><\u002Flabel>\n                  <input value=\"{{ formFirst }}\" sc-camel-on-input=\"{{ setFormFirst }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">นามสกุล <span style=\"color:#B88A24\">•<\u002Fspan><\u002Flabel>\n                  <input value=\"{{ formLast }}\" sc-camel-on-input=\"{{ setFormLast }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">เพศ<\u002Flabel>\n                  <sc-raw-select style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option>ไม่ระบุ<\u002Foption><option>ชาย<\u002Foption><option>หญิง<\u002Foption><\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <p style=\"margin:28px 0 0;font-size:12px;font-weight:700;letter-spacing:.12em;color:#B88A24\">สังกัดและระยะเวลา<\u002Fp>\n              <div style=\"margin-top:12px;display:grid;gap:16px;grid-template-columns:1fr 1fr\">\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">หน่วยงาน<\u002Flabel>\n                  <sc-raw-select sc-camel-on-change=\"{{ setFormDept }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option value=\"\">เลือกหน่วยงาน<\u002Foption><sc-for list=\"{{ departments }}\" as=\"d\" hint-placeholder-count=\"0\"><option value=\"{{ d.name }}\">{{ d.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">ตำแหน่ง<\u002Flabel>\n                  <sc-raw-select sc-camel-on-change=\"{{ setFormPos }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option value=\"\">เลือกตำแหน่ง<\u002Foption><sc-for list=\"{{ positions }}\" as=\"p\" hint-placeholder-count=\"0\"><option value=\"{{ p.title }}\">{{ p.title }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div>\n                  <label style=\"font-size:14px;font-weight:500;color:#102F55\">วันเริ่มปฏิบัติงาน <span style=\"color:#B88A24\">•<\u002Fspan><\u002Flabel>\n                  <input type=\"date\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                  <p style=\"margin:6px 0 0;font-size:12px;color:#64748b\">ใช้คำนวณอายุงานขั้นต่ำในการคัดกรอง<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:24px;display:flex;gap:12px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ savePerson }}\" style=\"height:40px;border:0;border-radius:8px;background:#0B3A6E;color:#fff;font-size:14px;padding:0 18px;cursor:pointer\">บันทึกข้อมูล<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ togglePersonForm }}\" style=\"height:40px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 18px;cursor:pointer\">ยกเลิก<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px\">\n            <div style=\"border-bottom:1px solid #E7EDF5;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n              <div>\n                <h2 style=\"margin:0;font-size:16px;font-weight:700;color:#102F55\">รายชื่อบุคลากร<\u002Fh2>\n                <p style=\"margin:4px 0 0;font-size:14px;color:#64748b\">ค้นหาด้วยรหัส ชื่อ หรือสกุล<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"position:relative;width:288px\">\n                <span class=\"ic\" style=\"position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8;-webkit-mask-image:url(&quot;5ae6d41f-f7c8-46b6-a3f9-f3ddd2be301c&quot;);mask-image:url(&quot;5ae6d41f-f7c8-46b6-a3f9-f3ddd2be301c&quot;)\"><\u002Fspan>\n                <input value=\"{{ search }}\" sc-camel-on-input=\"{{ setSearch }}\" placeholder=\"ค้นหาข้อมูลบุคลากร\" style=\"height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px 0 36px;font-size:14px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasPeople }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;text-align:left;font-size:14px\">\n                <sc-raw-thead style=\"background:#F7F9FC;color:#46617F;font-size:12px;font-weight:700\">\n                  <sc-raw-tr><sc-raw-th style=\"padding:16px 20px\">รหัส<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">ชื่อ-นามสกุล<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">หน่วยงาน<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">ตำแหน่ง<\u002Fsc-raw-th><sc-raw-th style=\"padding:16px 20px\">สถานะ<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n                <\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"0\">\n                    <sc-raw-tr style=\"border-top:1px solid #EDF1F6\">\n                      <sc-raw-td style=\"padding:16px 20px;font-weight:600;color:#102F55\">{{ p.code }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:16px 20px;color:#102F55\">{{ p.name }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:16px 20px;color:#475569\">{{ p.dept }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:16px 20px;color:#475569\">{{ p.pos }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:16px 20px\"><span style=\"border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:600;padding:4px 10px\">ปฏิบัติงาน<\u002Fspan><\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noPeople }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:24px\">\n                <div style=\"border:1px dashed #C9D6E6;border-radius:16px;background:rgba(255,255,255,.6);padding:40px 24px;text-align:center\">\n                  <p style=\"margin:0;font-weight:600;color:#102F55\">ยังไม่มีข้อมูลบุคลากร<\u002Fp>\n                  <p style=\"margin:8px auto 16px;max-width:448px;font-size:14px;line-height:24px;color:#64748b\">เพิ่มข้อมูลบุคลากรเพื่อเริ่มจัดเก็บประวัติและใช้ในการประมวลผ -size:16px;font-weight:700;color:#102F55\">กำหนดรอบตรวจ<\u002Fh2>\n              <div style=\"margin-top:20px;display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))\">\n                <div><label style=\"font-size:14px;font-weight:500;color:#102F55\">ชื่อรอบตรวจ <span style=\"color:#B88A24\">•<\u002Fspan><\u002Flabel><input value=\"{{ roundTitle }}\" sc-camel-on-input=\"{{ setRoundTitle }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><\u002Fdiv>\n                <div><label style=\"font-size:14px;font-weight:500;color:#102F55\">ปี พ.ศ.<\u002Flabel><input value=\"{{ roundYear }}\" sc-camel-on-input=\"{{ setRoundYear }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><\u002Fdiv>\n                <div><label style=\"font-size:14px;font-weight:500;color:#102F55\">เกณฑ์คุณสมบัติ<\u002Flabel><sc-raw-select style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option>เลือกเกณฑ์<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n                <div><label style=\"font-size:14px;font-weight:500;color:#102F55\">วันตัดรอบข้อมูล<\u002Flabel><input type=\"date\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><\u002Fdiv>\n                <div style=\"border:1px solid #D6E0ED;background:#fff;border-radius:8px;padding:8px 12px\">\n                  <label style=\"display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#102F55\"><input type=\"checkbox\" style=\"width:16px;height:16px;accent-color:#0B3A6E\">เปิดใช้รอบอัตโนมัติ<\u002Flabel>\n                  <p style=\"margin:4px 0 0;font-size:12px;color:#64748b\">จะเริ่มทำงานหลังเผยแพร่เว็บไซต์<\u002Fp>\n                <\u002Fdiv>\n \">ยังไม่มีข้อมูลรายงาน<\u002Fp>\n                    <p style=\"margin:8px auto 16px;max-width:448px;font-size:14px;line-height:24px;color:#64748b\">สร้างและประมวลผลรอบตรวจแล้วจึงจะส่งออกข้อมูลได้<\u002Fp>\n                    <button type=\"button\" sc-camel-on-click=\"{{ goCreateRound }}\" style=\"height:40px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 18px;cursor:pointer\">ไปหน้ารอบพิจารณา<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isReportTemplate }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid rgba(212,178,87,.5);background:#FFFDF8;border-radius:12px;padding:24px;max-width:840px\">\n              <div style=\"width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:#FFF1C7;color:#9A701A\"><span class=\"ic\" style=\"width:24px;height:24px;-webkit-mask-image:url(&quot;c8749337-0346-4715-bea2-3a360649fd5e&quot;);mask-image:url(&quot;c8749337-0346-4715-bea2-3a360649fd5e&quot;)\"><\u002Fspan><\u002Fdiv>\n              <h2 style=\"margin:20px 0 0;font-size:16px;font-weight:700;color:#102F55\">แม่แบบ Word สำหรับกรอกเอง<\u002Fh2>\n              <p style=\"margin:4px 0 0;font-size:14px;line-height:24px;color:#64748b\">ใช้ชื่อ...... นามสกุล.......... แทนชื่อบุคคลตัวอย่าง และคงข้อความส่วนอื่นตามแม่แบบ<\u002Fp>\n              <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ wordTemplates }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #E8D6A4;border-radius:12px;background:#fff;padding:12px 16px\">\n                    <div style=\"min-width:0\">\n                      <p style=\"margin:0;font-weight:600;color:#102F55\">{{ t.title }}<\u002Fp>\n                      <p style=\"margin:2px 0 0;font-size:12px;color:#64748b\">{{ t.description }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span class=\"ic\" style=\"width:16px;height:16px;color:#9A701A;-webkit-mask-image:url(&quot;84825e6d-1f7c-48f6-9269-e81e29c194e3&quot;);mask-image:url(&quot;84825e6d-1f7c-48f6-9269-e81e29c194e3&quot;)\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isReportGenerate }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px;padding:24px;max-width:840px\">\n              <div style=\"width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:#EAF2FC;color:#0B3A6E\"><span class=\"ic\" style=\"width:24px;height:24px;-webkit-mask-image:url(&quot;14e1fd9f-0b25-4a08-be60-9535d8a0ebb0&quot;);mask-image:url(&quot;14e1fd9f-0b25-4a08-be60-9535d8a0ebb0&quot;)\"><\u002Fspan><\u002Fdiv>\n              <h2 style=\"margin:20px 0 0;font-size:16px;font-weight:700;color:#102F55\">สร้าง Word จากข้อมูลระบบ<\u002Fh2>\n              <p style=\"margin:4px 0 0;font-size:14px;line-height:24px;color:#64748b\">ระบบจะคัดลอกแม่แบบและใส่เฉพาะชื่อ–นามสกุลของบุคลากรที่เลือก โดยไม่เขียนทับข้อมูลใดในระบบ<\u002Fp>\n              <div style=\"margin-top:20px;display:grid;gap:16px;grid-template-columns:1fr 1fr\">\n                <div>\n                  <label style=\"display:block;font-size:14px;font-weight:500;color:#102F55\">เลือกบุคลากร<\u002Flabel>\n                  <sc-raw-select style=\"margin-top:8px;height:44px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option>เลือกบุคลากร<\u002Foption><sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"0\"><option>{{ p.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div>\n                  <label style=\"display:block;font-size:14px;font-weight:500;color:#102F55\">เลือกรูปแบบ นร. 1<\u002Flabel>\n                  <sc-raw-select style=\"margin-top:8px;height:44px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option>นร. 1 จ.ภ.<\u002Foption><option>นร. 1 บ.ภ.<\u002Foption><option>นร. 1 ต.ภ.<\u002Foption><\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button type=\"button\" disabled=\"\" style=\"margin-top:20px;height:40px;border:0;border-radius:8px;background:#94a3b8;color:#fff;font-size:14px;padding:0 16px;display:flex;align-items:center;gap:8px;cursor:not-allowed;opacity:.75\">\n                <span class=\"ic\" style=\"width:16px;height:16px;-webkit-mask-image:url(&quot;c8749337-0346-4715-bea2-3a360649fd5e&quot;);mask-image:url(&quot;c8749337-0346-4715-bea2-3a360649fd5e&quot;)\"><\u002Fspan>\n                สร้าง Word จากระบบ\n              <\u002Fbutton>\n              <p style=\"margin:12px 0 0;font-size:13px;color:#64748b\">ต้องมีข้อมูลบุคลากรในระบบก่อนจึงจะสร้างเอกสารได้<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNews }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"margin-bottom:28px\">\n            <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">ประกาศและข่าวสาร<\u002Fp>\n            <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">ข่าวสารและประกาศ<\u002Fh1>\n            <p style=\"margin:8px 0 0;max-width:760px;font-size:14px;line-height:24px;color:#64748b\">ประกาศที่เผยแพร่แล้วตามระดับการมองเห็นของบัญชีผู้ใช้งาน<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px\">\n            <sc-for list=\"{{ publishedNews }}\" as=\"n\" hint-placeholder-count=\"1\">\n              <div style=\"border-top:1px solid #EDF1F6;padding:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n                <div style=\"min-width:0\">\n                  <p style=\"margin:0;font-weight:700;color:#102F55\">{{ n.title }}<\u002Fp>\n                  <p style=\"margin:6px 0 0;font-size:14px;line-height:22px;color:#64748b\">{{ n.description }}<\u002Fp>\n                  <p style=\"margin:6px 0 0;font-size:13px;color:#94a3b8\">{{ n.meta }}<\u002Fp>\n                <\u002Fdiv>\n                <button type=\"button\" style=\"flex:none;height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 14px;display:flex;align-items:center;gap:8px;cursor:pointer\">\n                  <span class=\"ic\" style=\"width:16px;height:16px;color:#9A701A;-webkit-mask-image:url(&quot;84825e6d-1f7c-48f6-9269-e81e29c194e3&quot;);mask-image:url(&quot;84825e6d-1f7c-48f6-9269-e81e29c194e3&quot;)\"><\u002Fspan>\n                  ดาวน์โหลด PDF\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noPublishedNews }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:24px\">\n                <div style=\"border:1px dashed #C9D6E6;border-radius:16px;background:rgba(255,255,255,.6);padding:48px 24px;text-align:center\">\n                  <p style=\"margin:0;font-weight:600;color:#102F55\">ยังไม่มีประกาศที่เผยแพร่<\u002Fp>\n                  <p style=\"margin:8px auto 0;max-width:448px;font-size:14px;line-height:24px;color:#64748b\">เมื่อผู้ดูแลระบบเปิดเผยแพร่ประกาศ รายการจะปรากฏในส่วนนี้<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAnnouncements }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"margin-bottom:28px\">\n            <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">ประกาศและข่าวสาร<\u002Fp>\n            <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">ข้อมูลข่าวสาร<\u002Fh1>\n            <p style=\"margin:8px 0 0;max-width:760px;font-size:14px;line-height:24px;color:#64748b\">จัดการเผยแพร่ แก้ไขประกาศ PDF และระดับการมองเห็น<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px;padding:24px\">\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"display:grid;gap:16px;grid-template-columns:1fr 1fr\">\n                <input value=\"{{ newsTitle }}\" sc-camel-on-input=\"{{ setNewsTitle }}\" placeholder=\"หัวข้อประกาศ\" style=\"height:44px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                <sc-raw-select sc-camel-on-change=\"{{ setNewsVisibility }}\" style=\"height:44px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option>สาธารณะ<\u002Foption><option>เฉพาะบุคลากร<\u002Foption><option>เฉพาะแอดมิน<\u002Foption><\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <textarea value=\"{{ newsDetail }}\" sc-camel-on-input=\"{{ setNewsDetail }}\" placeholder=\"รายละเอียดประกาศ (ไม่บังคับ)\" style=\"min-height:120px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:10px 12px;font-size:14px\"><\u002Ftextarea>\n              <div style=\"display:grid;gap:16px;grid-template-columns:1fr 1fr\">\n                <div style=\"height:44px;display:flex;align-items:center;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;color:#475569\">เลือกไฟล์ ไม่ได้เลือกไฟล์ใด<\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ publishNews }}\" style=\"height:44px;border:0;border-radius:8px;background:#0B3A6E;color:#fff;font-size:14px;font-weight:600;cursor:pointer\">อัปโหลดประกาศ PDF<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:24px;border:1px solid #DCE6F2;background:#fff;border-radius:12px\">\n            <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"1\">\n              <div style=\"border-top:1px solid #EDF1F6;padding:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n                <div style=\"min-width:0\">\n                  <p style=\"margin:0;font-weight:700;color:#102F55\">{{ n.title }}<\u002Fp>\n                  <p style=\"margin:6px 0 0;font-size:14px;line-height:22px;color:#64748b\">{{ n.description }}<\u002Fp>\n                  <p style=\"margin:6px 0 0;font-size:13px;color:#94a3b8\">{{ n.meta }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex:none;gap:8px\">\n                  <button type=\"button\" style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 14px;cursor:pointer\">ดาวน์โหลด PDF<\u002Fbutton>\n                  <button type=\"button\" style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 14px;cursor:pointer\">แก้ไข<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ n.toggle }}\" style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 14px;cursor:pointer\">{{ n.toggleLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMyHonors }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"margin-bottom:28px\">\n            <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">ข้อมูลส่วนบุคคล<\u002Fp>\n            <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">ผลเครื่องราชของฉัน<\u002Fh1>\n            <p style=\"margin:8px 0 0;max-width:760px;font-size:14px;line-height:24px;color:#64748b\">แสดงผลการคัดกรองและประวัติเครื่องราชเฉพาะของบัญชีผู้ใช้งานที่เข้าสู่ระบบ<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px;padding:24px\">\n            <div style=\"border:1px dashed #C9D6E6;border-radius:16px;background:rgba(255,255,255,.6);padding:80px 24px;text-align:center\">\n              <p style=\"margin:0;font-weight:700;color:#102F55\">ไม่พบข้อมูลบุคลากรที่ผูกกับอีเมลนี้<\u002Fp>\n              <p style=\"margin:8px auto 16px;max-width:560px;font-size:14px;line-height:24px;color:#64748b\">กรุณาติดต่อผู้ดูแลระบบเพื่อตรวจสอบอีเมลในข้อมูลบุคลากร<\u002Fp>\n              <button type=\"button\" sc-camel-on-click=\"{{ goPersonnel }}\" style=\"height:40px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 18px;cursor:pointer\">ตรวจสอบข้อมูลบุคลากร<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMembers }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"margin-bottom:28px\">\n            <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">การจัดการระบบ<\u002Fp>\n            <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">จัดการสมาชิก<\u002Fh1>\n            <p style=\"margin:8px 0 0;max-width:760px;font-size:14px;line-height:24px;color:#64748b\">เพิ่มสมาชิกด้วยอีเมล @spu.ac.th กำหนดบทบาท และปิดใช้งานบัญชีโดยไม่ลบข้อมูลเดิม<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px;padding:24px\">\n            <div style=\"display:grid;gap:16px;grid-template-columns:1fr 180px 160px;align-items:start\">\n              <div>\n                <input value=\"{{ memberEmail }}\" sc-camel-on-input=\"{{ setMemberEmail }}\" placeholder=\"name@spu.ac.th\" style=\"height:44px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\">\n                <p style=\"margin:6px 0 0;font-size:13px;{{ memberHintTone }}\">{{ memberHint }}<\u002Fp>\n              <\u002Fdiv>\n              <sc-raw-select sc-camel-on-change=\"{{ setMemberRole }}\" style=\"height:44px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><option>บุคลากร<\u002Foption><option>แอดมิน<\u002Foption><\u002Fsc-raw-select>\n              <button type=\"button\" sc-camel-on-click=\"{{ addMember }}\" style=\"height:44px;border:0;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;{{ addMemberTone }}\">บันทึกสมาชิก<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"margin-top:24px\">\n              <sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <div style=\"border-top:1px solid #EDF1F6;padding:16px 0;display:grid;gap:16px;grid-template-columns:1fr 180px 120px 140px;align-items:center\">\n                  <div style=\"display:flex;align-items:baseline;gap:12px;min-width:0\">\n                    <span style=\"font-size:16px;color:#102F55\">{{ m.name }}<\u002Fspan>\n                    <span style=\"font-size:14px;color:#94a3b8\">{{ m.email }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-raw-select style=\"height:36px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;font-size:14px\"><option>{{ m.role }}<\u002Foption><\u002Fsc-raw-select>\n                  <span style=\"font-weight:700;{{ m.stateTone }}\">{{ m.stateLabel }}<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ m.toggle }}\" style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;cursor:pointer\">{{ m.actionLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPermissions }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"margin-bottom:28px\">\n            <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;color:#B88A24\">การจัดการระบบ<\u002Fp>\n            <h1 style=\"margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.01em;color:#102F55\">ตั้งค่าสิทธิ์เมนู<\u002Fh1>\n            <p style=\"margin:8px 0 0;max-width:760px;font-size:14px;line-height:24px;color:#64748b\">แอดมินกำหนดการมองเห็นเมนูตามบทบาท โดยค่าเริ่มต้นของทุกบทบาทจะปิดทั้งหมด<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #DCE6F2;background:#fff;border-radius:12px\">\n            <div style=\"border-bottom:1px solid #E7EDF5;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <span style=\"font-size:14px;color:#64748b\">บทบาท<\u002Fspan>\n                <sc-raw-select sc-camel-on-change=\"{{ setPermRole }}\" style=\"height:40px;min-width:180px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;color:#102F55\"><option>บุคลากร<\u002Foption><option>แอดมิน<\u002Foption><\u002Fsc-raw-select>\n                <span style=\"font-size:13px;color:#64748b\">เปิดอยู่ {{ permOnCount }} จาก {{ permTotal }} เมนู<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ permAllOn }}\" style=\"height:36px;border:1px solid #DCE6F2;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 14px;cursor:pointer\">เปิดทั้งหมด<\u002Fbutton>\n :1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><\u002Fdiv>\n              <div><label style=\"font-size:14px;color:#102F55\">เว้นระยะหลังรับล่าสุด (ปี)<\u002Flabel><input value=\"{{ decoGapYears }}\" sc-camel-on-input=\"{{ setDecoGapYears }}\" style=\"margin-top:4px;height:40px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 12px;font-size:14px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <label style=\"margin-top:16px;border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:14px;color:#102F55\"><input type=\"checkbox\" style=\"width:16px;height:16px;accent-color:#0B3A6E\">ต้องมีประวัติได้รับเครื่องราชครั้งก่อน<\u002Flabel>\n          <\u002Fdiv>\n          <div>\n            <label style=\"font-size:14px;color:#102F55\">เงื่อนไขและระยะเวลาเพิ่มเติม<\u002Flabel>\n            <textarea value=\"{{ decoNote }}\" sc-camel-on-input=\"{{ setDecoNote }}\" placeholder=\"เช่น รายละเอียดของตำแหน่งหรือเงื่อนไขประกอบการพิจารณา\" style=\"margin-top:4px;min-height:110px;width:100%;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:8px 12px;font-size:14px\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px\">\n            <button type=\"button\" sc-camel-on-click=\"{{ saveDeco }}\" style=\"flex:1;height:44px;border:0;border-radius:8px;background:#0B3A6E;color:#fff;font-size:14px;font-weight:600;cursor:pointer\">บันทึกชั้นเครื่องราช<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeDecoPanel }}\" style=\"height:44px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#102F55;font-size:14px;padding:0 18px;cursor:pointer\">ยกเลิก<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nconst ICON = n => `https://unpkg.com/lucide-static@latest/icons/${n}.svg`;\n\nconst NAV_GROUPS = [\n  { label: \"เมนูการปฏิบัติงาน\", items: [\n    { key: \"dashboard\", label: \"ภาพรวม\", icon: \"layout-dashboard\" },\n    { key: \"personnel\", label: \"ข้อมูลบุคลากร\", icon: \"users-round\" },\n    { key: \"rounds\", label: \"รอบพิจารณา\", icon: \"clipboard-check\" },\n    { key: \"myHonors\", label: \"ผลเครื่องราชของฉัน\", icon: \"shield-check\" },\n  ]},\n  { label: \"ข้อมูลกำกับและรายงาน\", items: [\n    { key: \"configuration\", label: \"เกณฑ์และชั้นตรา\", icon: \"landmark\" },\n    { key: \"reports\", label: \"รายงานและส่งออก\", icon: \"file-chart-column\" },\n    { key: \"news\", label: \"ข่าวสารและประกาศ\", icon: \"newspaper\" },\n  ]},\n  { label: \"การจัดการระบบ\", items: [\n    { key: \"announcements\", label: \"จัดการประกาศ\", icon: \"megaphone\" },\n    { key: \"members\", label: \"จัดการสมาชิก\", icon: \"user-round-cog\" },\n    { key: \"permissions\", label: \"ตั้งค่าสิทธิ์เมนู\", icon: \"settings-2\" },\n  ]},\n];\nconst ALL_NAV = NAV_GROUPS.flatMap(g => g.items);\n\nconst TILES = [\n  { label: \"เข้าเกณฑ์เบื้องต้น\", icon: \"users-round\", tone: \"background:#EAF2FC;color:#0B3A6E\" },\n  { label: \"รอพิจารณา\", icon: \"clock\", tone: \"background:#FEF4D6;color:#8A5B06\" },\n  { label: \"ยืนยันผลแล้ว\", icon: \"circle-check\", tone: \"background:#EAF8F0;color:#25734B\" },\n  { label: \"รอบตรวจทั้งหมด\", icon: \"clipboard-check\", tone: \"background:#F1ECFC;color:#6B4CA4\" },\n];\n\nconst DECORATIONS = [\n  { rank: 2, code: \"ท.ภ.\", nameThai: \"ทุติยดิเรกคุณาภรณ์\", nameEnglish: \"KNIGHT COMMANDER (SECOND CLASS) OF THE MOST ADMIRABLE ORDER OF THE DIRKGUNABHORN\", minYears: \"0\", gapYears: \"5\", rule: \"ใช้คัดกรอง: อายุงานขั้นต่ำ 0 ปี · เว้นระยะรับชั้นถัดไป 5 ปี · ต้องมีประวัติรับเครื่องราชเดิม\", note: \"อธิการบดี (ผู้บริหารสถาบัน) ผู้รับใบอนุญาต กรรมการสภาสถาบัน ต้องเคยได้รับชั้นเดิมมาแล้วไม่น้อยกว่า 5 ปี (ตติยดิเรกคุณาภรณ์ ต.ภ.) จึงเสนอขอชั้นที่สูงกว่าได้\" },\n  { rank: 3, code: \"ต.ภ.\", nameThai: \"ตติยดิเรกคุณาภรณ์\", nameEnglish: \"COMMANDER (THIRD CLASS) OF THE MOST ADMIRABLE ORDER OF THE DIRKGUNABHORN\", minYears: \"0\", gapYears: \"5\", rule: \"ใช้คัดกรอง: อายุงานขั้นต่ำ 0 ปี · เว้นระยะรับชั้นถัดไป 5 ปี · ต้องมีประวัติรับเครื่องราชเดิม\", note: \"ต้องเคยได้รับชั้นเดิมมาแล้วไม่น้อยกว่า 5 ปี (จตุตถดิเรกคุณาภรณ์ จ.ภ.) จึงเสนอขอชั้นที่สูงกว่าได้\" },\n  { rank: 4, code: \"จ.ภ.\", nameThai: \"จตุตถดิเรกคุณาภรณ์\", nameEnglish: \"COMPANION (FOURTH CLASS) OF THE MOST ADMIRABLE ORDER OF THE DIRKGUNABHORN\", minYears: \"0\", gapYears: \"5\", rule: \"ใช้คัดกรอง: อายุงานขั้นต่ำ 0 ปี · เว้นระยะรับชั้นถัดไป 5 ปี · ต้องมีประวัติรับเครื่องราชเดิม\", note: \"ต้องเคยได้รับชั้นเดิมมาแล้วไม่น้อยกว่า 5 ปี (เบญจมดิเรกคุณาภรณ์ บ.ภ.) จึงเสนอขอชั้นที่สูงกว่าได้\" },\n  { rank: 5, code: \"บ.ภ.\", nameThai: \"เบญจมดิเรกคุณาภรณ์\", nameEnglish: \"MEMBER (FIFTH CLASS) OF THE MOST ADMIRABLE ORDER OF THE DIRKGUNABHORN\", minYears: \"5\", gapYears: \"0\", rule: \"ใช้คัดกรอง: อายุงานขั้นต่ำ 5 ปี · เว้นระยะรับชั้นถัดไป 0 ปี · ไม่บังคับประวัติรับเครื่องราชเดิม\", note: \"ผู้ขออายุงานต่อเนื่องไม่น้อยกว่า 5 ปีบริบูรณ์นับถึงวันเฉลิมพระชนมพรรษาของปีที่เสนอขอ และไม่เคยได้รับพระราชทานเครื่องราชอิสริยาภรณ์ตามกฎหมายนี้หรือกฎหมายอื่นมาก่อน สำหรับตำแหน่งหัวหน้าแผนก หัวหน้าฝ่าย หรือเจ้าหน้าที่ผู้สูงเทียบเท่า ต้องดำรงตำแหน่งไม่น้อยกว่า 5 และมีอายุงานรวมไม่น้อยกว่า 8 ปี\" },\n];\n\nconst WORD_TEMPLATES = [\n  { title: \"แบบ นร. 1 จ.ภ.\", description: \"แม่แบบกรอกเอง: ชื่อ...... นามสกุล.........\" },\n  { title: \"แบบ นร. 1 บ.ภ.\", description: \"แม่แบบกรอกเอง: ชื่อ...... นามสกุล.........\" },\n  { title: \"แบบ นร. 1 ต.ภ.\", description: \"แม่แบบกรอกเอง: ชื่อ...... นามสกุล.........\" },\n];\n\nconst PERM_LABELS = [\"ภาพรวม\", \"ข้อมูลบุคลากร\", \"รอบพิจารณา\", \"เกณฑ์และชั้นตรา\", \"รายงานและส่งออก\", \"ข่าวสาร\", \"ผลเครื่องราชของฉัน\"];\nconst EMPTY_PERMS = { \"บุคลากร\": PERM_LABELS.map(() => false), \"แอดมิน\": PERM_LABELS.map(() => false) };\nconst clone = o => JSON.parse(JSON.stringify(o));\n\nclass Component extends DCLogic {\n  state = {\n    page: \"dashboard\",\n    configTab: \"decoration\",\n    reportTab: \"csv\",\n    showPersonForm: false,\n    formCode: \"\", formFirst: \"\", formLast: \"\", formDept: \"\", formPos: \"\",\n    people: [],\n    search: \"\",\n    showRoundForm: false,\n    roundTitle: \"\", roundYear: \"2569\",\n    rounds: [], selectedRound: null,\n    departments: [], positions: [],\n    deptCode: \"\", deptName: \"\", posTitle: \"\", posLevel: \"\",\n    decorations: DECORATIONS,\n    showDecoPanel: false, decoEditIndex: null,\n    decoRank: \"\", decoCode: \"\", decoNameThai: \"\", decoNameEnglish: \"\", decoMinYears: \"\", decoGapYears: \"\", decoNote: \"\",\n    news: [{ title: \"บัญชีราคาชดใช้แทนเครื่องราชอิสริยาภรณ์และเหรียญราชอิสริยาภรณ์\", description: \"เอกสารประกาศสำหรับทดสอบการจัดการข่าวสารและการเปิดปิดเผยแพร่\", visibility: \"สาธารณะ\", published: true }],\n    newsTitle: \"\", newsDetail: \"\", newsVisibility: \"สาธารณะ\",\n    members: [\n      { name: \"Kittipitch Thaweepatphitak\", email: \"kittipitch.th@spu.ac.th\", role: \"แอดมิน\", active: true },\n      { name: \"datateam ChatGPT SPU\", email: \"datateam.gpt@spu.ac.th\", role: \"บุคลากร\", active: true },\n    ],\n    memberEmail: \"\", memberRole: \"บุคลากร\",\n    permRole: \"บุคลากร\",\n    perms: clone(EMPTY_PERMS),\n    savedPerms: clone(EMPTY_PERMS),\n  };\n\n  set = (k, v) => this.setState({ [k]: v });\n  onInput = k => e => this.set(k, e.target.value);\n  go = page => () => this.setState({ page });\n\n  openDeco(index) {\n    const d = index === null ? null : this.state.decorations[index];\n    this.setState({\n      showDecoPanel: true, decoEditIndex: index,\n      decoRank: d ? String(d.rank) : \"\", decoCode: d ? d.code : \"\",\n      decoNameThai: d ? d.nameThai : \"\", decoNameEnglish: d ? d.nameEnglish : \"\",\n      decoMinYears: d ? d.minYears : \"\", decoGapYears: d ? d.gapYears : \"\", decoNote: d ? d.note : \"\",\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const active = ALL_NAV.find(n => n.key === s.page);\n    const q = s.search.trim().toLowerCase();\n    const people = s.people.filter(p => !q || (p.code + p.name).toLowerCase().includes(q));\n    const rolePerms = s.perms[s.permRole];\n    const emailOk = s.memberEmail.trim().endsWith(\"@spu.ac.th\");\n    const setupDone = [s.decorations.length > 0, s.people.length > 0, s.rounds.length > 0];\n\n    return {\n      headerTitle: active ? active.label : \"ระบบจัดการ\",\n      navGroups: NAV_GROUPS.map(g => ({\n        label: g.label,\n        items: g.items.map(item => ({\n          label: item.label,\n          iconUrl: ICON(item.icon),\n          tone: s.page === item.key ? \"background:#E5C66A;color:#0B315C;font-weight:600\" : \"\",\n          go: this.go(item.key),\n        })),\n      })),\n      isDashboard: s.page === \"dashboard\",\n      isPersonnel: s.page === \"personnel\",\n      isRounds: s.page === \"rounds\",\n      isConfiguration: s.page === \"configuration\",\n      isReports: s.page === \"reports\",\n      isNews: s.page === \"news\",\n      isAnnouncements: s.page === \"announcements\",\n      isMyHonors: s.page === \"myHonors\",\n      isMembers: s.page === \"members\",\n      isPermissions: s.page === \"permissions\",\n      goPersonnel: this.go(\"personnel\"),\n      goCreateRound: () => this.setState({ page: \"rounds\", showRoundForm: true }),\n\n      tiles: TILES.map(t => ({ label: t.label, tone: t.tone, iconUrl: ICON(t.icon), value: 0 })),\n      setupSteps: [\n        { title: \"กำหนดชั้นตราและเกณฑ์\", detail: `บันทึกแล้ว ${s.decorations.length} ชั้น`, action: \"ไปตั้งค่า\", go: this.go(\"configuration\") },\n        { title: \"เพิ่มข้อมูลบุคลากร\", detail: s.people.length ? `บันทึกแล้ว ${s.people.length} คน` : \"ยังไม่มีข้อมูลในระบบ\", action: \"เพิ่มข้อมูล\", go: this.go(\"personnel\") },\n        { title: \"สร้างรอบตรวจ\", detail: s.rounds.length ? `มี ${s.rounds.length} รอบ` : \"ยังไม่มีรอบตรวจ\", action: \"สร้างรอบ\", go: () => this.setState({ page: \"rounds\", showRoundForm: true }) },\n      ].map((step, i) => ({\n        ...step,\n        badge: setupDone[i] ? \"✓\" : String(i + 1),\n        badgeTone: setupDone[i] ? \"background:#E5C66A;color:#0B315C\" : \"background:rgba(255,255,255,.12);color:#E5C66A\",\n      })),\n\n      showPersonForm: s.showPersonForm,\n      togglePersonForm: () => this.set(\"showPersonForm\", !s.showPersonForm),\n      openPersonForm: () => this.set(\"showPersonForm\", true),\n      formCode: s.formCode, formFirst: s.formFirst, formLast: s.formLast,\n      setFormCode: this.onInput(\"formCode\"), setFormFirst: this.onInput(\"formFirst\"), setFormLast: this.onInput(\"formLast\"),\n      setFormDept: this.onInput(\"formDept\"), setFormPos: this.onInput(\"formPos\"),\n      savePerson: () => {\n        if (!s.formCode.trim() || !s.formFirst.trim()) return;\n        this.setState({\n          people: [...s.people, { code: s.formCode.trim(), name: `${s.formFirst.trim()} ${s.formLast.trim()}`.trim(), dept: s.formDept || \"—\", pos: s.formPos || \"—\" }],\n          formCode: \"\", formFirst: \"\", formLast: \"\", showPersonForm: false,\n        });\n      },\n      people,\n      hasPeople: people.length > 0,\n      noPeople: people.length === 0,\n      search: s.search, setSearch: this.onInput(\"search\"),\n\n      showRoundForm: s.showRoundForm,\n      toggleRoundForm: () => this.set(\"showRoundForm\", !s.showRoundForm),\n      openRoundForm: () => this.set(\"showRoundForm\", true),\n      roundTitle: s.roundTitle, roundYear: s.roundYear,\n      setRoundTitle: this.onInput(\"roundTitle\"), setRoundYear: this.onInput(\"roundYear\"),\n      saveRound: () => {\n        if (!s.roundTitle.trim()) return;\n        const id = Date.now();\n        this.setState({ rounds: [...s.rounds, { id, title: s.roundTitle.trim(), year: s.roundYear }], roundTitle: \"\", showRoundForm: false, selectedRound: id });\n      },\n      rounds: s.rounds.map(r => ({\n        title: r.title, year: r.year,\n        tone: s.selectedRound === r.id ? \"background:#EEF5FD\" : \"background:#fff\",\n        select: () => this.set(\"selectedRound\", r.id),\n      })),\n      hasRounds: s.rounds.length > 0,\n      noRounds: s.rounds.length === 0,\n\n      configTabs: [\n        { key: \"criteria\", label: \"เกณฑ์คุณสมบัติ\", icon: \"sliders-horizontal\" },\n        { key: \"decoration\", label: \"ชั้นเครื่องราช\", icon: \"landmark\" },\n        { key: \"structure\", label: \"หน่วยงานและตำแหน่ง\", icon: \"building-2\" },\n      ].map(t => ({\n        label: t.label, iconUrl: ICON(t.icon),\n        tone: s.configTab === t.key ? \"background:#0B3A6E;color:#fff;border:1px solid #0B3A6E\" : \"background:#fff;color:#102F55;border:1px solid #DCE6F2\",\n        go: () => this.set(\"configTab\", t.key),\n      })),\n      isTabCriteria: s.configTab === \"criteria\",\n      isTabDecoration: s.configTab === \"decoration\",\n      isTabStructure: s.configTab === \"structure\",\n      decorationCount: s.decorations.length,\n      decorations: s.decorations.map((d, i) => ({ ...d, edit: () => this.openDeco(i) })),\n\n      showDecoPanel: s.showDecoPanel,\n      decoPanelTitle: s.decoEditIndex === null ? \"เพิ่มชั้นเครื่องราช\" : \"แก้ไขชั้นเครื่องราช\",\n      openDecoPanel: () => this.openDeco(null),\n      closeDecoPanel: () => this.setState({ showDecoPanel: false, decoEditIndex: null }),\n      decoRank: s.decoRank, decoCode: s.decoCode, decoNameThai: s.decoNameThai, decoNameEnglish: s.decoNameEnglish,\n      decoMinYears: s.decoMinYears, decoGapYears: s.decoGapYears, decoNote: s.decoNote,\n      setDecoRank: this.onInput(\"decoRank\"), setDecoCode: this.onInput(\"decoCode\"),\n      setDecoNameThai: this.onInput(\"decoNameThai\"), setDecoNameEnglish: this.onInput(\"decoNameEnglish\"),\n      setDecoMinYears: this.onInput(\"decoMinYears\"), setDecoGapYears: this.onInput(\"decoGapYears\"),\n      setDecoNote: this.onInput(\"decoNote\"),\n      saveDeco: () => {\n        if (!s.decoNameThai.trim() || !s.decoCode.trim()) return;\n        const min = s.decoMinYears.trim() || \"0\";\n        const gap = s.decoGapYears.trim() || \"0\";\n        const entry = {\n          rank: Number(s.decoRank) || 0, code: s.decoCode.trim(), nameThai: s.decoNameThai.trim(),\n          nameEnglish: s.decoNameEnglish.trim(), minYears: min, gapYears: gap,\n          rule: `ใช้คัดกรอง: อายุงานขั้นต่ำ ${min} ปี · เว้นระยะรับชั้นถัดไป ${gap} ปี`,\n          note: s.decoNote.trim(),\n        };\n        const list = s.decoEditIndex === null\n          ? [...s.decorations, entry]\n          : s.decorations.map((d, i) => i === s.decoEditIndex ? entry : d);\n        this.setState({ decorations: list.slice().sort((a, b) => a.rank - b.rank), showDecoPanel: false, decoEditIndex: null });\n      },\n\n      departments: s.departments, positions: s.positions,\n      noDepartments: s.departments.length === 0, noPositions: s.positions.length === 0,\n      deptCode: s.deptCode, deptName: s.deptName, posTitle: s.posTitle, posLevel: s.posLevel,\n      setDeptCode: this.onInput(\"deptCode\"), setDeptName: this.onInput(\"deptName\"),\n      setPosTitle: this.onInput(\"posTitle\"), setPosLevel: this.onInput(\"posLevel\"),\n      addDept: () => {\n        if (!s.deptName.trim()) return;\n        this.setState({ departments: [...s.departments, { code: s.deptCode.trim() || \"—\", name: s.deptName.trim() }], deptCode: \"\", deptName: \"\" });\n      },\n      addPosition: () => {\n        if (!s.posTitle.trim()) return;\n        this.setState({ positions: [...s.positions, { title: s.posTitle.trim(), level: s.posLevel.trim() || \"1\" }], posTitle: \"\", posLevel: \"\" });\n      },\n\n      reportTabs: [\n        { key: \"csv\", label: \"รายงาน CSV\", icon: \"file-spreadsheet\" },\n        { key: \"template\", label: \"แม่แบบ Word\", icon: \"file-text\" },\n        { key: \"generate\", label: \"สร้างจากระบบ\", icon: \"user-round-check\" },\n      ].map(t => ({\n        label: t.label, iconUrl: ICON(t.icon),\n        tone: s.reportTab === t.key ? \"background:#0B3A6E;color:#fff;border:1px solid #0B3A6E\" : \"background:#fff;color:#102F55;border:1px solid #DCE6F2\",\n        go: () => this.set(\"reportTab\", t.key),\n      })),\n      isReportCsv: s.reportTab === \"csv\",\n      isReportTemplate: s.reportTab === \"template\",\n      isReportGenerate: s.reportTab === \"generate\",\n      wordTemplates: WORD_TEMPLATES,\n\n      news: s.news.map((n, i) => ({\n        title: n.title, description: n.description,\n        meta: `${n.visibility} · ${n.published ? \"เผยแพร่\" : \"ปิดข่าว\"}`,\n        toggleLabel: n.published ? \"ปิดข่าว\" : \"เปิดข่าว\",\n        toggle: () => this.setState({ news: s.news.map((x, j) => j === i ? { ...x, published: !x.published } : x) }),\n      })),\n      publishedNews: s.news.filter(n => n.published).map(n => ({ title: n.title, description: n.description, meta: n.visibility })),\n      noPublishedNews: s.news.filter(n => n.published).length === 0,\n      newsTitle: s.newsTitle, newsDetail: s.newsDetail,\n      setNewsTitle: this.onInput(\"newsTitle\"), setNewsDetail: this.onInput(\"newsDetail\"), setNewsVisibility: this.onInput(\"newsVisibility\"),\n      publishNews: () => {\n        if (!s.newsTitle.trim()) return;\n        this.setState({ news: [{ title: s.newsTitle.trim(), description: s.newsDetail.trim() || \"ไม่มีรายละเอียดประกาศ\", visibility: s.newsVisibility, published: true }, ...s.news], newsTitle: \"\", newsDetail: \"\" });\n      },\n\n      members: s.members.map((m, i) => ({\n        name: m.name, email: m.email, role: m.role,\n        stateLabel: m.active ? \"ใช้งาน\" : \"ปิดใช้งาน\",\n        stateTone: m.active ? \"color:#102F55\" : \"color:#94a3b8\",\n        actionLabel: m.active ? \"ปิดใช้งาน\" : \"เปิดใช้งาน\",\n        toggle: () => this.setState({ members: s.members.map((x, j) => j === i ? { ...x, active: !x.active } : x) }),\n      })),\n      memberEmail: s.memberEmail,\n      memberHint: s.memberEmail.trim() && !emailOk ? \"อีเมลต้องลงท้ายด้วย @spu.ac.th\" : \"ใช้ได้เฉพาะอีเมลที่ลงท้ายด้วย @spu.ac.th\",\n      memberHintTone: s.memberEmail.trim() && !emailOk ? \"color:#b91c1c\" : \"color:#64748b\",\n      addMemberTone: emailOk ? \"background:#0B3A6E\" : \"background:#8592ab;opacity:.8\",\n      setMemberEmail: this.onInput(\"memberEmail\"), setMemberRole: this.onInput(\"memberRole\"),\n      addMember: () => {\n        const email = s.memberEmail.trim();\n        if (!email.endsWith(\"@spu.ac.th\")) return;\n        this.setState({ members: [...s.members, { name: email.split(\"@\")[0], email, role: s.memberRole, active: true }], memberEmail: \"\" });\n      },\n\n      permRole: s.permRole,\n      setPermRole: e => this.set(\"permRole\", e.target.value),\n      permTotal: PERM_LABELS.length,\n      permOnCount: rolePerms.filter(Boolean).length,\n      permDirty: JSON.stringify(rolePerms) !== JSON.stringify(s.savedPerms[s.permRole]),\n      permAllOn: () => this.setState({ perms: { ...s.perms, [s.permRole]: PERM_LABELS.map(() => true) } }),\n      permAllOff: () => this.setState({ perms: { ...s.perms, [s.permRole]: PERM_LABELS.map(() => false) } }),\n      permSave: () => this.setState({ savedPerms: { ...s.savedPerms, [s.permRole]: rolePerms.slice() } }),\n      permReset: () => this.setState({ perms: { ...s.perms, [s.permRole]: s.savedPerms[s.permRole].slice() } }),\n      permissions: PERM_LABELS.map((label, i) => {\n        const on = rolePerms[i];\n        return {\n          label,\n          stateLabel: on ? \"มองเห็นเมนูนี้\" : \"ซ่อนเมนูนี้\",\n          trackTone: on ? \"background:#0B3A6E;border-color:#0B3A6E;justify-content:flex-end\" : \"background:#E7EDF5;justify-content:flex-start\",\n          knobTone: \"\",\n          toggle: () => this.setState({ perms: { ...this.state.perms, [s.permRole]: this.state.perms[s.permRole].map((v, j) => j === i ? !v : v) } }),\n        };\n      }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
